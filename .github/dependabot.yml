version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The gap that recurs: a repo adds a Dockerfile and never adds the ecosystem, so
  # the base image is pinned once and then never moves again.
  - package-ecosystem: docker
    directory: "/reference-node"
    schedule:
      interval: weekly

  # directory was "/" and there is no pip manifest there, so this
  # entry silently did nothing -- dependabot reports no error, it just
  # never opens a PR.
  - package-ecosystem: pip
    directory: "/conformance"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/reference-node"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
