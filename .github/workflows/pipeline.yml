# Standalone repository hygiene checks for OpenPermit / ORI.
#
# ORI's executable conformance and reference-node tests live in
# .github/workflows/ori-conformance.yml. This workflow provides independent
# repository-level secret, conflict and workflow-lint gates.
name: pipeline

on:
  pull_request:
    branches: [test, prod]
  push:
    branches: [test, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Rough checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.18.4"
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ':(exclude)*.md'; then
            echo "::error::unresolved merge-conflict markers in tracked files"; exit 1
          fi
          echo "OK — no conflict markers"

      - name: Forbidden secret-bearing files
        run: |
          hits=$(git ls-files \
            | grep -nE '\.(pem|key|p12|pfx|keystore|jks)$|(^|/)\.env$|(^|/)\.env\.[^/]+$|(^|/)id_rsa$|(^|/)age\.key$' \
            | grep -vE '\.(example|sample|template)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::files that look like plaintext secrets are tracked:"
            echo "$hits"; exit 1
          fi
          echo "OK — no forbidden secret-bearing files"

      - name: Secret scan (gitleaks)
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLo "/tmp/${asset}" "${base}/${asset}"
          curl -fsSLo /tmp/gitleaks_checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" /tmp/gitleaks_checksums.txt > /tmp/gitleaks_asset.sha256
          (cd /tmp && sha256sum -c gitleaks_asset.sha256)
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --no-git --source . --redact -v --no-banner --exit-code 1 \
            || { echo "::error::gitleaks detected secrets. Findings above name file:rule:line (values redacted). False positive -> .gitleaks.toml allowlist."; exit 1; }
          echo "OK — gitleaks clean"

      - name: Lint workflows (actionlint)
        run: |
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLo "/tmp/${asset}" "${base}/${asset}"
          curl -fsSLo /tmp/actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "  ${asset}$" /tmp/actionlint_checksums.txt > /tmp/actionlint_asset.sha256
          (cd /tmp && sha256sum -c actionlint_asset.sha256)
          tar -xzf "/tmp/${asset}" -C /tmp actionlint
          chmod +x /tmp/actionlint
          /tmp/actionlint -color
