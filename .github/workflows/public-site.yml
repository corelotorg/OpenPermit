name: Public site release artifact
on:
  pull_request:
    paths: ["site/**", "docs/**", "spec/**", "profiles/**", "verification/**", "index.html", "*.md", ".well-known/**", ".github/workflows/public-site.yml"]
  push:
    branches: [test, "release/**"]
    paths: ["site/**", "docs/**", "spec/**", "profiles/**", "verification/**", "index.html", "*.md", ".well-known/**", ".github/workflows/public-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s site -p 'test_*.py'
      - run: python site/build.py --out _site
      - run: python site/check.py _site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openpermit-public-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
